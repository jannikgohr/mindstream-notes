# CI for every push / PR. Five parallel job groups:
#   - format   : `prettier --check` on the web + docs sources
#                (pnpm format:web:check), the theme guardrail
#                (pnpm lint:theme), `eslint .` and the i18n bundle-parity
#                check, Linux — fails on formatting drift, a theme
#                violation, a lint error, or a translation gap.
#   - js       : svelte-check + vitest + vite build, on all three desktop OSes.
#   - rust     : `cargo test` for the desktop target on all three desktop OSes,
#                plus `cargo fmt --check` and `cargo clippy -D warnings` once
#                on Linux.
#   - coverage : single-OS (Linux) run that measures vitest (v8) and cargo
#                (llvm-cov) line coverage and publishes both to Codecov so the
#                score / badge / PR comment stay current. Kept separate from the
#                matrix jobs because coverage instrumentation is slower and only
#                needs to run once.
#   - e2e      : Playwright drives the SvelteKit SPA (browser-fallback mode,
#                mock store) on Linux to cover the Svelte components unit tests
#                can't reach.
#   - app-e2e  : wdio + tauri-driver against the packaged binary under Xvfb.
#                By far the most expensive group, so it is scoped: `single`
#                on any code change, the two collaboration suites only where
#                they can tell you something (see the `changes` job).
#
# Everything except `format` is gated on the diff containing something other
# than Markdown — see the `changes` job for why, and for the branch-protection
# caveat that comes with it.
#
# Android isn't tested here — its build matrix lives in release.yml because
# it needs the NDK (~1.5 GB) and a signing keystore.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs are the escape hatch from every gate below: "Run workflow"
  # always runs the full matrix, on whichever branch you pick. If you are
  # reaching for it, you don't want CI second-guessing which half to skip.
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves minutes on rapid pushes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this diff actually needs. A docs-only push used to run the whole
  # matrix — the audit write-ups alone cost several full runs. `format` is
  # deliberately not gated: prettier checks Markdown too, so a docs change
  # still has a gate of its own.
  #
  # The same job decides which app-tier suites run. `single` covers general
  # regressions and runs on every code change; the two collaboration suites
  # are two thirds of the run's wall time and only exercise sync/sharing, so
  # they are reserved for pushes to main, diffs that touch that code, and PRs
  # labelled `ci:app-e2e`.
  #
  # NOTE: a gated-out job reports as "Skipped". `main` carries no branch
  # protection today; if required checks are turned on later, confirm the
  # merge gate treats a skipped job as passing before trusting this.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      suites: ${{ steps.decide.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      # Skipped entirely on a manual run — `decide` forces everything on, so
      # there is nothing for a filter to say.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Two traps live in this one pattern. The filters are OR-ed, so
          # `!**/*.md` plus `!docs/**` would match every non-docs Markdown
          # file and defeat the whole thing — it has to be a single negated
          # group. And `!(**/*.md)` alone still selects a root-level
          # `README.md`, because `**/` does not match an empty path segment;
          # both spellings are needed. Verified against picomatch, which is
          # what paths-filter matches with.
          filters: |
            code:
              - '!(**/*.md|*.md)'
            # The surfaces the two-client suites actually exercise. This is a
            # heuristic, not a proof: the Yjs/editor code they also depend on
            # is spread across src/lib/editor and friends, and listing that
            # would re-select every PR. A change that breaks collaboration from
            # somewhere else is caught by the label or by main.
            collab:
              - 'src/lib/sync/**'
              - 'src-tauri/src/sync/**'
              - 'src-tauri/src/sharing/**'
              - 'src-tauri/src/collab_events.rs'
              - 'backend/**'
              - 'e2e-tests/app/specs/collab*'
              - 'e2e-tests/app/specs/sharing*'
              - 'e2e-tests/app/specs/sync-history*'
              - 'e2e-tests/app/specs/seed-merge*'
              - 'e2e-tests/app/wdio.multiremote*'
              - '.github/workflows/test.yml'

      - name: Decide what runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          COLLAB: ${{ steps.filter.outputs.collab }}
          # Through the environment, not string-interpolated into the script:
          # a label is user-supplied text.
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          all='list=["single","multi","multi-a2"]'

          # Manual run: no gates, whatever the diff looks like.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo "$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] || [ "$COLLAB" = true ] ||
             printf '%s' "$LABELS" | grep -q '"ci:app-e2e"'; then
            echo "$all" >> "$GITHUB_OUTPUT"
          else
            echo 'list=["single"]' >> "$GITHUB_OUTPUT"
          fi

  js:
    name: JS check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  rust:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri 2's desktop bundle pulls webkit2gtk-4.1 + libsoup-3.0; the
      # secret-service keyring backend uses the `vendored` feature so we
      # don't need libdbus headers, but the other GUI deps are still
      # required even for `cargo test` because tauri-build runs.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting and lints run only on Linux: both are platform-agnostic,
      # and repeating them on three runners just triples the failure noise
      # for one underlying problem. `cargo test` stays on all three because
      # the platform-specific code (keyring, paths, drawing) is what it's
      # there to catch.
      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --all --check

      # --all-targets covers tests and benches too, so a lint can't hide in
      # a #[cfg(test)] module. The tree is clean at zero warnings today;
      # -D keeps it that way rather than letting a backlog accumulate.
      - name: cargo clippy
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # Coverage thresholds fail CI; reports upload even when tests fail.
  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        timeout-minutes: 20
        run: |
          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-llvm-cov

      - run: pnpm install --frozen-lockfile

      - name: JS coverage
        run: pnpm test:coverage

      - name: Rust coverage
        if: ${{ !cancelled() }}
        run: node src-tauri/scripts/rust-coverage.mjs --lcov --output-path ../.output/coverage/rust/lcov.info

      - name: Note skipped Codecov upload
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured."

      # `disable_search: true` stops codecov-action from auto-discovering every
      # lcov.info in the workspace — without it each flag uploads BOTH the
      # frontend and backend reports, cross-contaminating the flags. We name the
      # single report explicitly via `files:` instead.
      - name: Upload frontend coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./.output/coverage/frontend/lcov.info
          disable_search: true
          flags: frontend
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

      - name: Upload backend coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./.output/coverage/rust/lcov.info
          disable_search: true
          flags: backend
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  # End-to-end: Playwright builds the SvelteKit SPA and drives it through
  # `vite preview` in browser-fallback mode (no Tauri, no Rust — the
  # in-memory mock store backs every API call). Linux-only; the suite is
  # platform-agnostic so one OS is enough.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    # Keep this tag in sync with @playwright/test in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .output/playwright-report/browser
          retention-days: 7

  # Formatting gate: `prettier --check` over the web + docs sources (the same
  # `pnpm format:web:check` the husky pre-commit hook runs locally). Catches
  # formatting drift — including broken/unformatted Markdown docs — in CI rather
  # than relying on the hook alone. Linux-only; formatting is platform-agnostic.
  format:
    name: Prettier + ESLint (web + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:web:check

      # Theme guardrail (docs/theming.md). It used to run only in the
      # husky hooks, so `--no-verify` or a fresh clone skipped it and
      # nothing on the server ever checked. Costs under a second.
      - run: pnpm lint:theme

      # `eslint .` fails on errors only; warnings (`no-explicit-any`,
      # `prefer-svelte-reactivity`) stay visible in the log without gating,
      # so the backlog is reported rather than silently tolerated.
      - run: pnpm lint

      # Translation bundles must carry the same key set. `de.json` had
      # silently fallen 19 keys behind `en.json` — those settings rendered
      # as raw key ids for German users.
      - run: pnpm lint:i18n

      # The path filters that decide which jobs run, checked against the
      # matcher paths-filter itself uses. A wrong glob here doesn't fail
      # anything — it just quietly stops running tests, which is why the guard
      # lives in the one job no gate can skip.
      - run: pnpm lint:ci

  app-e2e:
    name: Tauri E2E (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ["single"] on an ordinary PR; all three on main, on a diff that
        # touches collaboration, or on a PR labelled `ci:app-e2e`.
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    env:
      MINDSTREAM_DOCKER_NO_SUDO: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth dbus-x11 gnome-keyring

      # The suites all build the same crate with the same features, so they
      # share one cache entry instead of keying on the job name and each
      # compiling the dependency tree from scratch (~7 minutes a job).
      #
      # `cache-on-failure` matters more than it looks: the default drops the
      # cache when the job fails, so a red suite never saves one — and then
      # never has one to restore, which is exactly the state these jobs were
      # in. A failed test run still compiled the dependencies correctly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: app-e2e
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - name: Start disposable collaboration backend
        if: matrix.suite != 'single'
        run: pnpm backend:test:up
      - name: Run packaged app suite
        env:
          APP_SUITE: ${{ matrix.suite }}
        run: |
          case "$APP_SUITE" in
            single) export TEST_COMMAND=test:e2e:app ;;
            multi) export TEST_COMMAND=test:e2e:app:multi ;;
            multi-a2) export TEST_COMMAND=test:e2e:app:multi:a2 ;;
          esac
          dbus-run-session -- bash -eu -c '
            eval "$(printf %s ci-test-keyring | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run -a pnpm "$TEST_COMMAND"
          '
      - name: Capture backend logs
        if: ${{ !cancelled() && matrix.suite != 'single' }}
        run: |
          mkdir -p .output/wdio
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.test.yml --env-file backend/.env.test -p mindstream-test logs --no-color > .output/wdio/backend.log
      - name: Stop disposable backend
        if: ${{ always() && matrix.suite != 'single' }}
        run: pnpm backend:test:down
      - name: Upload app test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wdio-${{ matrix.suite }}
          path: .output/wdio
          retention-days: 7

  # One check that is always reported, whatever the gates decided.
  #
  # A gated-out job reports as "Skipped", and how a branch-protection rule
  # treats that is a footgun nobody should have to remember: make `CI` the
  # single required check and the question never comes up. Skipped is a pass
  # here — that is the whole point of the gates — while a failure or a
  # cancellation anywhere fails this job by name.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, js, rust, coverage, e2e, format, app-e2e]
    steps:
      # Plain expressions, no jq or node: this job is the one that must never
      # be the thing that broke. `needs.*.result` is an array of every needed
      # job's outcome, and "skipped" is deliberately not in the failure list.
      - name: Job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::CI failed — see the failing job in this run."
          exit 1
