name: Browser SQLite proof

on:
  pull_request:
    paths:
      - 'src-tauri/storage-core/**'
      - 'src-tauri/browser-wasm/**'
      - 'src-tauri/Cargo.*'
      - 'src/lib/browser/**'
      - 'src/routes/sqlite-proof/**'
      - 'src/routes/+layout.svelte'
      - 'scripts/browser/**'
      - 'e2e-tests/sqlite/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/browser-sqlite.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: browser-sqlite
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p mindstream-storage-core
      - run: pnpm exec vitest run src/lib/browser/client.test.ts
      - run: pnpm test:sqlite
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-sqlite-failures
          path: .output/test-results/sqlite
          retention-days: 7
