name: Build performance

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.*'
      - 'src-tauri/build.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/plugin-runtime/**'
      - 'src-tauri/scripts/tauri*'
      - 'scripts/check-cargo-fresh*'
      - '.github/workflows/build-performance.yml'
  workflow_dispatch:
    inputs:
      cold:
        description: Skip the Rust cache for a cold native build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
      TAURI_CONFIG: '{"productName":"Mindstream Notes Dev","identifier":"com.jannikgohr.mindstream-notes.dev"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep this benchmark comparable across runs and with the local evidence.
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold }}
        with:
          workspaces: src-tauri
          shared-key: dev-build
      # Guests are committed and AOT is off. No pnpm install, guest compiler,
      # frontend server, display or user data directory is needed for this build.
      - name: Build development backend
        run: |
          mkdir -p .output/build-performance
          rustc --version > .output/build-performance/toolchain.txt
          /usr/bin/time -f '%e' -o .output/build-performance/initial-seconds.txt cargo build --locked --manifest-path src-tauri/Cargo.toml -p mindstream-notes --no-default-features --features dev-environment --timings
      - name: Assert unchanged rebuild reuses all artifacts
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          /usr/bin/time -f '%e' -o .output/build-performance/repeat-seconds.txt cargo build --locked --manifest-path src-tauri/Cargo.toml -p mindstream-notes --no-default-features --features dev-environment --timings --message-format=json > .output/build-performance/repeat.jsonl
          node scripts/check-cargo-fresh.mjs .output/build-performance/repeat.jsonl
      - name: Summarize development build
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, statSync } from 'node:fs';
          import { checkCargoFresh } from './scripts/check-cargo-fresh.mjs';
          const read = name => readFileSync(`.output/build-performance/${name}`, 'utf8').trim();
          const reuse = checkCargoFresh(read('repeat.jsonl'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Development backend build', '',
            `Revision: ${process.env.GITHUB_SHA}.`, '',
            `Toolchain: ${read('toolchain.txt')}. Two Cargo jobs. Linux split debug information enabled.`, '',
            '| Measurement | Result |', '| --- | ---: |',
            `| Initial build, including any restored dependencies | ${read('initial-seconds.txt')} s |`,
            `| Unchanged rebuild | ${read('repeat-seconds.txt')} s |`,
            `| Artifacts reused | ${reuse.artifacts} |`,
            `| Artifacts recompiled | ${reuse.rebuilt} |`,
            `| Executable | ${(statSync('src-tauri/target/debug/mindstream-notes').size / 1024 ** 2).toFixed(1)} MiB |`, '',
            'Cargo HTML reports and build-script phase timings are attached as artifacts.', ''
          ].join('\n'));
          NODE
      - name: Retain development build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-build-timings
          path: |
            .output/build-performance/
            src-tauri/target/cargo-timings/
            src-tauri/target/debug/build/mindstream-notes-*/out/build-timings.json
          if-no-files-found: ignore
          retention-days: 7
