# Mindstream server with its database.
#
#   cd backend/server
#   cp .env.example .env    # then set POSTGRES_PASSWORD in it
#   docker compose up -d --build
#
# Plain HTTP on port 3735 of the `server` service. Put a TLS-terminating
# reverse proxy in front for anything but local use.
#
# This is the whole backend: accounts, storage, sharing and live rooms.

services:
  server:
    build:
      context: ../..
      dockerfile: backend/server/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MINDSTREAM_DATABASE_URL: postgres://mindstream:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres/mindstream
      # closed: only with a signup code you made. invite: also by an invite
      # link made to allow it. open: anyone who can reach the server.
      MINDSTREAM_SIGNUP: ${MINDSTREAM_SIGNUP:-closed}
      # Hostnames clients use, comma separated. Needed when the reverse proxy
      # does not pass the original Host header through.
      MINDSTREAM_PUBLIC_HOSTS: ${MINDSTREAM_PUBLIC_HOSTS:-}
      MINDSTREAM_TEST_RESET: ${MINDSTREAM_TEST_RESET:-false}
      # Sign-in attempts one address may make per minute. 0 turns the limit off.
      MINDSTREAM_AUTH_RATE_PER_MINUTE: ${MINDSTREAM_AUTH_RATE_PER_MINUTE:-10}
      # Lets another program set account limits. Empty leaves that interface off.
      MINDSTREAM_ADMIN_TOKEN: ${MINDSTREAM_ADMIN_TOKEN:-}
      # Seals authenticator secrets. Empty makes the server create a key in
      # the volume below on first start.
      MINDSTREAM_SECRET_KEY: ${MINDSTREAM_SECRET_KEY:-}
      # Where the page behind an invite link sends people without the app.
      # Empty keeps the default, the project's releases page.
      MINDSTREAM_APP_URL: ${MINDSTREAM_APP_URL:-}
    volumes:
      # Attachment chunks, and the secret key unless one is given above.
      # Losing this volume loses every attachment and every authenticator.
      - blobs:/data
    ports:
      - '${MINDSTREAM_PORT:-3735}:3735'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mindstream
      POSTGRES_USER: mindstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindstream -d mindstream']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  blobs:
  postgres:
