[package]
name = "mindstream-plugin-runtime"
version = "0.1.0"
description = "Sandboxed plugin execution for Mindstream Notes"
authors = ["Jannik Gohr"]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

# The plugin runtime lives in its own crate so it builds without Tauri, and the
# host services every runtime shares exist in one place.

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
uuid = { version = "1", features = ["v4"] }
